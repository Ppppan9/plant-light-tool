<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>花候图志 · 核玩工作台</title>
<style>
:root{--paper:#f7f9f5;--white:#fcfdfb;--wash:#e9efeb;--ink:#20342d;--muted:#53665d;--line:#bac8bf;--green:#214b3d;--rust:#a94328;--rust-wash:#f8ece5;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;--serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;--sans:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}button,input,select{font:inherit;color:inherit}button,summary,select{cursor:pointer}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:35px;border:1px solid var(--line);border-radius:3px;background:var(--white);padding:5px 10px;font-weight:600}button:hover,summary:hover{background:var(--wash)}button:active{background:#d8e5dc}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--rust);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.atlas-icon{flex:none;vertical-align:middle}.primary,button.ed-green{background:var(--green);border-color:var(--green);color:white}.primary:hover,button.ed-green:hover{background:#31624e}.record,.on{color:var(--rust);border-color:#c88874;background:var(--rust-wash)}button.on{background:var(--rust);color:white}.symbol-btn{width:35px;flex:none;padding:0}.mono,.serial,.eyebrow,.view-meta{font:11px/1.3 var(--mono);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template:62px minmax(0,1fr)/minmax(0,1fr) clamp(345px,31vw,465px);height:100vh;height:100dvh;min-height:470px}.mast{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 26px;border-bottom:1px solid var(--ink);background:var(--white)}.brandmark{width:33px;height:34px;border:1px solid var(--green);display:grid;place-items:center;color:var(--green);position:relative}.brandmark svg{width:25px;height:25px}.brandmark:after{content:"";position:absolute;right:-2px;bottom:-2px;width:6px;height:6px;background:var(--rust)}.mast h1{font:700 24px/1.1 var(--serif);margin:0}.mast .serial{color:var(--muted);border-left:1px solid var(--line);padding-left:15px}.mast .station{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.station i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.observation{display:grid;grid-template-rows:45px minmax(0,1fr) 34px;min-width:0;min-height:0;background:var(--wash)}.strip,.view-foot{display:flex;align-items:center;gap:10px;padding:0 24px;min-width:0}.strip{border-bottom:1px solid var(--line);background:#f1f5f0}.strip strong{font-size:14px}.strip .serial{color:var(--rust)}.strip .measure,.view-foot .measure{margin-left:auto}.view-foot{border-top:1px solid var(--line);color:var(--muted);font-size:11px}.scale-rule{display:inline-block;height:7px;width:39px;background:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 7px);border-bottom:1px solid var(--muted)}#stageWrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;isolation:isolate;background-color:#edf1ed;background-image:linear-gradient(90deg,#c1cec563 1px,transparent 1px),linear-gradient(#c1cec563 1px,transparent 1px);background-size:24px 24px}#stage{display:block;height:min(calc(100dvh - 178px),calc((100vw - clamp(345px,31vw,465px) - 68px)*20/9));width:auto;aspect-ratio:9/20;max-width:100%;cursor:pointer;touch-action:none;background:var(--white);box-shadow:0 0 0 1px #718578,2px 5px 12px #23473124}.margin-mark{position:absolute;pointer-events:none;left:13px;top:50%;writing-mode:vertical-rl;color:var(--muted);font:10px var(--mono)}.view-meta{color:var(--muted)}
#panel{min-height:0;min-width:0;overflow:auto;background:var(--white);border-left:1px solid var(--ink);scrollbar-color:#a1b2a6 transparent;scrollbar-width:thin}.section{padding:19px 22px;border-bottom:1px solid var(--line)}.eyebrow{display:flex;gap:9px;align-items:center;color:var(--rust)}.eyebrow:before{content:"";width:16px;height:1px;background:currentColor}.section h2{font:700 24px/1.15 var(--serif);margin:7px 0 14px}.section h3{margin:0;font:700 17px/1.2 var(--serif)}.subhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.subhead .serial{color:var(--muted)}.level-line,.action-line,.inspector-search{display:flex;gap:7px;align-items:center}.level-line select{flex:1;min-width:0;height:37px;border:1px solid #97a99d;border-radius:2px;padding:0 6px;background:white;font-weight:600}.level-line button{padding:0 10px;min-height:37px}.action-line{margin-top:10px;flex-wrap:wrap}.action-line .primary,.action-line .record{flex:auto;min-width:91px}.aux-line{display:flex;gap:7px;margin:12px 0 0;align-items:center;flex-wrap:wrap}.aux-line button{min-height:30px;font-size:12px;background:transparent}.aux-line .right{margin-left:auto}#status{color:var(--green);font-size:12px;padding-top:13px;font-variant-numeric:tabular-nums}#recInfo,#recList a{font-size:11px;color:var(--rust);overflow-wrap:anywhere}#recList a{display:block}#recInfo:empty,#recList:empty{display:none}#panelTools{padding-bottom:12px;border-bottom:0}.inspector-search{border:1px solid var(--line);background:#fff;padding-left:8px;gap:5px;margin-top:12px}.inspector-search>.atlas-icon{color:var(--muted);width:16px}.inspector-search input{flex:1;min-width:0;height:33px;border:0;background:transparent}.inspector-search button{border:0;border-left:1px solid var(--line);min-height:32px;width:31px;padding:0;border-radius:0}
#panelBody{padding:0 22px 26px}#panelBody details{border-top:1px solid var(--line)}#panelBody details:last-child{border-bottom:1px solid var(--line)}summary{display:flex;align-items:center;gap:9px;padding:11px 1px;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary .gi{display:grid;place-content:center;color:var(--green);width:21px}summary .gn{flex:1}summary .gc{color:var(--muted);font:11px var(--mono)}summary:after{content:"";width:6px;height:6px;margin:0 4px 0 2px;border-bottom:1px solid;border-right:1px solid;transform:rotate(45deg)}details[open]>summary:after{transform:rotate(225deg)}details[open]>summary .gn{color:var(--green)}
.row{display:flex;align-items:center;gap:6px;padding:5px 0;min-height:34px}.row label{width:43%;flex:none;color:var(--muted);font-size:12px}.row input[type=range]{min-width:0;flex:1;accent-color:var(--green)}.row .val{width:56px}.row[data-key=seed] .val{width:87px}.row input:not([type=range]):not([type=checkbox]),.row select{border:1px solid var(--line);background:var(--white);border-radius:2px;padding:3px 5px;font:12px var(--sans);height:28px}.row select,.row input[type=text],.row input[type=file]{flex:1;min-width:0}.row input[type=color]{width:43px;padding:1px!important}.row input[type=checkbox]{appearance:none;flex:none;width:32px;height:18px;margin-left:auto;background:#bac4bb;border:1px solid #758678;border-radius:12px;position:relative;cursor:pointer}.row input[type=checkbox]:before{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff}.row input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}.row input[type=checkbox]:checked:before{left:16px}.row.t-checkbox label{flex:1;width:auto}.row button{min-height:29px;font-size:12px;white-space:normal}.row[data-key^="_"] label{flex:1}.row[hidden],details[hidden]{display:none!important}#handPrev{width:120px;height:auto;border:1px solid var(--line);cursor:crosshair}#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:7px 12px;max-width:92%;pointer-events:none;z-index:4;opacity:0}#toast.show{opacity:1}.jump{display:none}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(min-width:821px) and (max-height:710px){#app{grid-template-rows:50px minmax(0,1fr)}.observation{grid-template-rows:34px minmax(0,1fr) 28px}#stage{height:calc(100dvh - 134px)}.section{padding:13px 16px}#panelBody{padding-inline:16px}}
@media(max-width:820px){#app{display:flex;flex-direction:column;height:auto;min-height:100dvh}.mast{height:53px;flex:none;padding:0 14px;gap:9px}.mast h1{font-size:21px}.mast .serial{font-size:10px;padding-left:9px}.mast .station{display:none}.jump{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:12px;color:var(--green);text-decoration:none;border-bottom:1px solid var(--green)}.jump svg{width:14px}.observation{display:grid;grid-template-rows:34px minmax(0,auto) 27px}.strip,.view-foot{padding:0 14px}.strip .mono{font-size:10px}#stageWrap{padding:10px 0}#stage{height:min(66dvh,calc((100vw - 36px)*20/9));width:auto;max-width:calc(100% - 32px)}.margin-mark{left:7px;font-size:9px}#panel{overflow:visible;border-left:0;border-top:1px solid var(--ink)}.section{padding:16px}#panelBody{padding:0 16px 28px}.section h2{font-size:22px}.symbol-btn{width:38px}.action-line button{min-height:39px}.row{min-height:38px}}
@media(max-width:350px){.mast .serial{display:none}.action-line{gap:4px}.aux-line{gap:4px}.row label{width:37%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
#btnAuto:before,#btnRec:before{content:"";display:inline-block;flex:none}#btnAuto:before{border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor}#btnRec:before{width:8px;height:8px;border-radius:50%;background:currentColor}#btnAuto.on:before,#btnRec.on:before{width:8px;height:8px;border:0;border-radius:0;background:currentColor}.level-line [data-icon],.aux-line [data-icon],.jump [data-icon]{display:inline-flex;align-items:center}
</style></head><body>
<div id="app">
  <header class="mast"><span class="brandmark" data-icon="sprout" aria-hidden="true"></span><h1>花候图志</h1><span class="serial" lang="en">FIELD ATLAS</span><span class="station"><i></i>核玩工作台</span><a href="#panel" class="jump">控制台<span data-icon="sliders-horizontal"></span></a></header>
  <main class="observation" aria-label="实时预览"><header class="strip"><strong>观测台</strong><span class="measure mono" id="atlasCanvasSize">720 × 1600</span></header>
    <div id="stageWrap"><canvas id="stage" width="720" height="1600" aria-label="花候图志游戏画布，按住格子预览路径，松手种植"></canvas><div id="toast" role="status"></div></div>
    <footer class="view-foot"><span class="scale-rule" aria-hidden="true"></span><span class="mono">9 : 20</span><span class="measure">纵向观测</span></footer>
  </main>
  <aside id="panel" aria-label="核玩工具控制台" tabindex="-1"><section id="panelHead" class="section"><h2>制作控制台</h2>
    <div class="level-line"><select id="levelSel" aria-label="选择关卡"></select><button id="btnBuilder" title="打开关卡编辑器"><span data-icon="grid-2x2"></span>编辑关卡</button></div>
    <div class="action-line"><button id="btnAuto" class="primary">自动通关</button><button id="btnRec" class="record">开始录制</button><button class="symbol-btn" id="btnShot" aria-label="截取画面" title="截取画面" data-icon="camera"></button><button class="symbol-btn" id="btnNew" aria-label="重新开始" title="重新开始" data-icon="rotate-ccw"></button><button class="symbol-btn" id="btnSeed" aria-label="换一个随机花园" title="换一个随机花园" data-icon="shuffle"></button></div>
    <div class="aux-line"><button id="btnShape" title="按图片轮廓生成关卡"><span data-icon="shapes"></span>图形关卡</button><button id="btnImport" title="导入设置"><span data-icon="upload"></span>导入</button><button id="btnExport" title="导出设置"><span data-icon="download"></span>导出</button><button id="btnReset" class="symbol-btn right" aria-label="恢复默认设置" title="恢复默认设置" data-icon="settings-2"></button></div>
    <input id="importFile" type="file" accept=".json,application/json" hidden><input id="shapeFile" type="file" accept="image/png,image/webp" hidden>
    <div id="status" role="status">正在加载花园…</div><div id="recInfo"></div><div id="recList"></div>
  </section>
  <section class="section" id="panelTools"><div class="subhead"><h3>参数索引</h3></div><div class="inspector-search"><span data-icon="search"></span><input id="panelSearch" type="search" placeholder="搜索参数" aria-label="搜索设置"><button id="btnExpandAll" class="symbol-btn" aria-label="全部展开" title="全部展开" data-icon="chevrons-up-down"></button><button id="btnCollapseAll" class="symbol-btn" aria-label="全部收起" title="全部收起" data-icon="chevrons-down-up"></button></div></section>
  <div id="panelBody"></div></aside>
</div><script>/*__BUNDLE__*/</script></body></html>
